name: Deploy Edge Functions

# Deploys the Supabase Edge Functions in supabase/functions/* from the browser.
# Run it manually from the GitHub "Actions" tab (Run workflow), or it fires
# automatically when function code changes on main.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   • SUPABASE_ACCESS_TOKEN  — a personal access token from the Supabase
#                              dashboard (Account → Access Tokens).
#   • SUPABASE_PROJECT_REF   — your project's Reference ID (Project Settings →
#                              General, or the /project/<ref> part of the URL).

on:
  workflow_dispatch:        # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Deploys every function under supabase/functions/. The CLI bundles each
      # function's _shared imports automatically.
      - name: Deploy functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
